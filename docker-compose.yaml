
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - skemex_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - skemex

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - skemex_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - skemex

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - skemex_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - skemex

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1; then
          echo "Model $$OLLAMA_MODEL already present — skipping pull."
        else
          echo "Pulling Ollama model $$OLLAMA_MODEL..."
          ollama pull "$$OLLAMA_MODEL"
        fi
        echo "Model $$OLLAMA_MODEL is ready."
    networks:
      - skemex
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Skemex.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Auth__ValidIssuer: Skemex
      Auth__ValidAudience: Skemex
      Auth__JwtSecret: ${JWT_SECRET}
      Auth__TokenType: Bearer
      Auth__ExpiresInMinutes: "60"
      SuperAdmin__Email: ${SUPERADMIN_EMAIL}
      SuperAdmin__Password: ${SUPERADMIN_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      Storage__Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT}
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Ai__Provider: Ollama
      Ai__DefaultModel: ${OLLAMA_MODEL:-llama3.2:1b}
      Ai__Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://ollama:11434}
      Ai__Ollama__TimeoutSeconds: ${OLLAMA_TIMEOUT_SECONDS:-600}
    networks:
      - skemex

networks:
  skemex:
    name: skemex-network
    external: true

volumes:
  skemex_pgdata:
  skemex_minio:
  skemex_ollama:
